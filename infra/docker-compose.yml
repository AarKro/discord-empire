# Discord Empire — single-VPS Docker Compose (tech spec §Environments, §CI/CD).
# Only services actually built for iteration 1 (framework spec §10): Postgres,
# the two reference bots, and the tick service. The workflow engine is no longer a
# standalone service — it runs embedded inside each bot (§7). The four remaining
# bots are intentionally NOT scaffolded yet.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empire}
      POSTGRES_DB: empire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire -d empire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: run forward-only drizzle migrations BEFORE the app containers
  # start (tech spec §CI/CD deploy sequence).
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  tick-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: tick-service
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-merchant:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-merchant
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      MERCHANT_TOKEN: ${MERCHANT_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-builder:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-builder
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      BUILDER_TOKEN: ${BUILDER_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-architect:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-architect
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      ARCHITECT_TOKEN: ${ARCHITECT_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-secret-merchant:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-secret-merchant
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      SECRET_MERCHANT_TOKEN: ${SECRET_MERCHANT_TOKEN}
      # LLM-worded /approach (§5.4/§11) — optional; unset ⇒ authored fallback lines.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DIALOGUE_MODEL: ${DIALOGUE_MODEL:-claude-haiku-4-5}
      DIALOGUE_MAX_PER_HOUR: ${DIALOGUE_MAX_PER_HOUR:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-herald:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-herald
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      HERALD_TOKEN: ${HERALD_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-exchange:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-exchange
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      EXCHANGE_TOKEN: ${EXCHANGE_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-ops:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-ops
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      OPS_TOKEN: ${OPS_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot-warden:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        APP: bot-warden
    environment:
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:-empire}@postgres:5432/empire
      CONTENT_DIR: /app/content
      WARDEN_TOKEN: ${WARDEN_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../content:/app/content:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
