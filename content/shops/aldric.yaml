# The merchant's wares (§5.3), shared by every continent's persona — Aldric in
# the Highlands, Mei Lin in the harbour, Hazel in the Thornwild.
#
# `origin` is §2.5's local trade good, named by the continent's `resource_bias`
# in continents.yaml (highlands / harbor / wildwood). On its home continent a
# ware is stocked deep at `base_price`; everywhere else the merchant carries a
# couple at a steep markup as a curio from their own travels — a shop window on
# what a caravan or a voyage would actually get you (see core's world/goods.ts).
#
# UNTAGGED WARES ARE UBIQUITOUS, DELIBERATELY. Bread is bread. Keep anything
# progression-critical untagged too, or players on the wrong continent end up
# gated behind a caravan they may not be able to afford yet — which is why the
# arcane forge blueprint carries no origin.
id: aldric_wares
currency: gold
#
# `restock` is units per interval, capped at the ware's REGIONAL stock — so an
# imported curio climbs back to 2, not to its home continent's shelf depth. A ware
# with NO rate never returns, which is the only thing keeping a one-of-a-kind rare
# genuinely rare; leave the blueprint bare on purpose.
items:
  - item_id: bread
    name: "Loaf of Bread"
    base_price: 5
    stock: 100
    # A staple should never be the reason someone can't eat.
    unlimited: true
  - item_id: iron_ore
    name: "Iron Ore"
    base_price: 25
    stock: 40
    origin: highlands
    restock: 10
  - item_id: salt_fish
    name: "Barrel of Salt Fish"
    base_price: 18
    stock: 60
    origin: harbor
    restock: 12
  - item_id: heartwood
    name: "Heartwood Timber"
    base_price: 30
    stock: 35
    origin: wildwood
    restock: 8
  - item_id: blueprint_arcane_forge
    name: "Blueprint: Arcane Forge"
    base_price: 120
    stock: 1
    floor_price: 90
    reputation_discount: 0.15
#
# What the merchant BUYS (§2.5 buy-back) — the way produce, loot and quest
# tokens turn into gold. The merchant pays half the ware's REGIONAL price,
# so a good tagged with another continent's `origin` fetches 1.5× its base here:
# hauling iron ore out of the Highlands, or salt fish out of the harbour, pays.
# Bought goods are consumed, not restocked onto the shelf.
buys:
  # Produce (content/catalog/blueprints.yaml `produces`).
  - { item_id: grain, name: "Sack of Grain", base_price: 8 }
  - { item_id: iron_tools, name: "Iron Tools", base_price: 40 }
  - { item_id: arcane_ingot, name: "Arcane Ingot", base_price: 120 }
  # Loot (content/catalog/encounters.yaml).
  - { item_id: wolf_pelt, name: "Wolf Pelt", base_price: 12 }
  - { item_id: rune_shard, name: "Rune Shard", base_price: 80 }
  # Regional goods — worth more away from home.
  - { item_id: iron_ore, name: "Iron Ore", base_price: 25, origin: highlands }
  - { item_id: salt_fish, name: "Barrel of Salt Fish", base_price: 18, origin: harbor }
  - { item_id: heartwood, name: "Heartwood Timber", base_price: 30, origin: wildwood }
  # Quest rewards (merchant_quest.yaml) — keepsakes with a buyer.
  - { item_id: trade_charter, name: "Old Trade Charter", base_price: 80 }
  - { item_id: guard_token, name: "Guard's Token", base_price: 80 }
