id: architect
token_env: ARCHITECT_TOKEN
personas:
  "${GUILD_CONTINENT_ONE}":
    nickname: "Archivist Vael"
    avatar: vael.png
    locale_flavor: highlands
  "${GUILD_CONTINENT_TWO}":
    nickname: "Loremaster Soraya"
    avatar: soraya.png
    locale_flavor: harbor
  "${GUILD_CONTINENT_THREE}":
    nickname: "Greensage Ilyth"
    avatar: ilyth.png
    locale_flavor: wildwood
# Registration order = dispatch order. topology is the infra presence gate.
capabilities:
  - trade
  - topology
  - research
  - notify
  - commands
  # §5.12: keeps this bot's permit token from ever running dry. An empty
  # sink would fail every action it gates, realm-wide.
  - restock
content:
  workflows:
    - workflows/architect_research.yaml
