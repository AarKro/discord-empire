# The exchange — player-to-player market bot (framework spec §5.11). Its own
# bot/token; present in every continent guild to register the market commands and
# own that continent's Marketplace board. A market-clerk face, no voice presence.
id: exchange
token_env: EXCHANGE_TOKEN
personas:
  "${GUILD_CONTINENT_ONE}":
    nickname: "The Exchange"
    locale_flavor: highlands
  "${GUILD_CONTINENT_TWO}":
    nickname: "The Exchange"
    locale_flavor: harbor
  "${GUILD_CONTINENT_THREE}":
    nickname: "The Exchange"
    locale_flavor: wildwood
capabilities:
  - commands
  - market
  - auction
  - caravan
content:
  # The caravan sources from the merchant's wares (names + base prices) and needs
  # the continent ring to name and validate destinations.
  shop: shops/aldric.yaml
  continents: continents.yaml
  workflows:
    - workflows/caravan.yaml
