id: builder
token_env: BUILDER_TOKEN
personas:
  "${GUILD_CONTINENT_ONE}":
    nickname: "Master Godric"
    avatar: godric.png
    locale_flavor: highlands
  "${GUILD_CONTINENT_TWO}":
    nickname: "Foreman Kai"
    avatar: kai.png
    locale_flavor: harbor
  "${GUILD_CONTINENT_THREE}":
    nickname: "Warden Bryn"
    avatar: bryn.png
    locale_flavor: wildwood
# Registration order = dispatch order. topology is the infra presence gate.
capabilities:
  - trade
  - topology
  - land
  - notify
  - commands
  # §5.12: keeps this bot's permit token from ever running dry. An empty
  # sink would fail every action it gates, realm-wide.
  - restock
content:
  # §1.3 content as data: synced into its catalog table on boot.
  blueprints: catalog/blueprints.yaml
  workflows:
    - workflows/player_build.yaml
