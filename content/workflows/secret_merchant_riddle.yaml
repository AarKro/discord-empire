# The Secret Merchant's riddle session (framework spec §5.4 / §11).
#
# One instance per player, started by /riddle. The stranger poses a riddle; the
# player may ask up to THREE questions, each answered with one LLM-worded hint,
# and may submit an answer at any point. Solving pays the riddle's reward once.
#
# WHY THE SHAPE IS LIKE THIS
#
#  * The QUESTION BUDGET is three explicit states (posing -> hint_1 -> hint_2 ->
#    hint_3) rather than a counter, because `set:` resolves sources and has no
#    arithmetic — there is no way to express "n + 1". Spelling the ladder out also
#    lets the "Ask" button simply disappear on the last rung.
#
#  * Each `ask`/`answer` is a `kind: modal` option, so the player types free text.
#    The typed value arrives as `event.payload.input` on the ordinary
#    dialogue.choose, and `set:` lifts it into instance context.
#
#  * The verbs can't branch the machine on success (a workflow action only returns
#    a goto on the on_error path), so riddle.judge EMITS riddle.solved /
#    riddle.missed and the `on:` blocks below branch on those. Same for the hint
#    text, which rides back on riddle.hinted's payload.
#
#  * `greet` carries a prompt so the FIRST render is a dialogue.opened — that is
#    what makes the render capability open the private thread. A prompt-less
#    initial state would emit dialogue.node into a thread that doesn't exist yet
#    and be dropped.
#
#  * The clock is PER STATE, not one session-wide deadline: guards have no date
#    arithmetic, so a single "solve within N minutes" bound isn't expressible.
#    Each rung therefore gives the player a fresh 3 minutes to act.
id: secret_merchant_riddle
scope: player
# One live session per player: a re-delivered trigger (or an impatient second
# /riddle) must not open a parallel instance spending its own hint budget.
singleton: true
trigger: { event: riddle.requested }
initial: greet
states:
  greet:
    prompt: >-
      *The stranger draws back their hood.* You want something of me, traveller?
      Then earn it. Answer me this — and you may ask three questions before you
      speak your answer.
    actions:
      - { riddle.deal: {} }
    on:
      riddle.dealt: posing
      riddle.absent: absent
      riddle.exhausted: exhausted
    timer: { after: 3m, goto: expired }

  absent:
    prompt: "*The shadows are empty.* Whatever you sought here has moved on."
    final: true

  exhausted:
    prompt: >-
      *The stranger almost smiles.* You have had every riddle I carry. Come back
      when I have walked further and heard new ones.
    final: true

  # The riddle text arrives on riddle.dealt; `used` starts empty and accumulates
  # the hint indices already spent so the same hint is never given twice.
  posing:
    set:
      riddle: "event.payload.riddle"
      riddle_text: "event.payload.prompt"
      used: "''"
    prompt: "{{context.riddle_text}}"
    options:
      - id: ask
        label: Ask a question
        kind: modal
        goto: hinting_1
        input:
          label: Ask the stranger
          placeholder: What do you want to know?
          max_length: 200
          ack: "*You speak, and the stranger tilts their head.*"
      - id: answer
        label: Answer the riddle
        kind: modal
        goto: judging
        input:
          label: Your answer
          placeholder: Speak plainly.
          max_length: 60
          ack: "*You whisper your answer.*"
    timer: { after: 3m, goto: expired }

  hinting_1:
    set: { question: "event.payload.input" }
    actions:
      - riddle.hint:
          riddle: "{{context.riddle}}"
          used: "{{context.used}}"
          question: "{{context.question}}"
    on: { riddle.hinted: hint_1 }
    timer: { after: 1m, goto: expired }

  hint_1:
    set: { hint: "event.payload.text", used: "event.payload.used" }
    prompt: "*The stranger considers.* {{context.hint}}"
    options:
      - id: ask
        label: Ask another question
        kind: modal
        goto: hinting_2
        input:
          label: Ask the stranger
          max_length: 200
          ack: "*You speak again.*"
      - id: answer
        label: Answer the riddle
        kind: modal
        goto: judging
        input: { label: Your answer, max_length: 60, ack: "*You whisper your answer.*" }
    timer: { after: 3m, goto: expired }

  hinting_2:
    set: { question: "event.payload.input" }
    actions:
      - riddle.hint:
          riddle: "{{context.riddle}}"
          used: "{{context.used}}"
          question: "{{context.question}}"
    on: { riddle.hinted: hint_2 }
    timer: { after: 1m, goto: expired }

  hint_2:
    set: { hint: "event.payload.text", used: "event.payload.used" }
    prompt: "*The stranger considers.* {{context.hint}}"
    options:
      - id: ask
        label: Ask your last question
        kind: modal
        goto: hinting_3
        input:
          label: Ask the stranger
          max_length: 200
          ack: "*You speak once more.*"
      - id: answer
        label: Answer the riddle
        kind: modal
        goto: judging
        input: { label: Your answer, max_length: 60, ack: "*You whisper your answer.*" }
    timer: { after: 3m, goto: expired }

  hinting_3:
    set: { question: "event.payload.input" }
    actions:
      - riddle.hint:
          riddle: "{{context.riddle}}"
          used: "{{context.used}}"
          question: "{{context.question}}"
    on: { riddle.hinted: hint_3 }
    timer: { after: 1m, goto: expired }

  # Last rung: the question budget is spent, so only the answer option remains.
  hint_3:
    set: { hint: "event.payload.text", used: "event.payload.used" }
    prompt: "*The stranger's patience thins.* {{context.hint}} Now answer."
    options:
      - id: answer
        label: Answer the riddle
        kind: modal
        goto: judging
        input: { label: Your answer, max_length: 60, ack: "*You whisper your answer.*" }
    timer: { after: 3m, goto: expired }

  judging:
    set: { guess: "event.payload.input" }
    actions:
      - riddle.judge: { riddle: "{{context.riddle}}", guess: "{{context.guess}}" }
    on:
      riddle.solved: solved
      riddle.missed: missed
    timer: { after: 1m, goto: expired }

  # A wrong answer costs the remaining questions — the stranger has said their
  # piece. The player may keep guessing until the clock runs out.
  missed:
    prompt: "*The stranger shakes their head slowly.* No. Think again, traveller."
    options:
      - id: answer
        label: Try again
        kind: modal
        goto: judging
        input: { label: Your answer, max_length: 60, ack: "*You try again.*" }
    timer: { after: 3m, goto: expired }

  solved:
    actions:
      - riddle.reward: { riddle: "{{context.riddle}}" }
    prompt: >-
      *The stranger laughs, once, like stones shifting.* So you do listen. Take
      this — and keep the habit.
    final: true

  expired:
    prompt: >-
      *You look up, and the stranger is gone.* Only the cold where they stood, and
      the riddle unanswered.
    final: true
